<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude_chord</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23fff%27/%3E%3Crect x=%274%27 width=%273%27 height=%2710%27 fill=%27%230038ff%27/%3E%3Crect x=%279%27 width=%273%27 height=%2710%27 fill=%27%23000%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">claude_chord</div>
    <div class="status">
      <span id="st-server">サーバー: 接続中…</span>
      <span id="st-midi">MIDI: 確認中…</span>
      <label class="toggle"><input type="checkbox" id="midi-sound"> MIDIの音も鳴らす</label>
      <button id="audio-btn" type="button">音を出す</button>
    </div>
  </header>

  <main class="panes">
    <section class="pane" aria-labelledby="claude-h">
      <h2 id="claude-h" class="pane-h"><span class="swatch swatch-claude"></span>Claude</h2>
      <div id="claude-empty" class="empty">まだ何も弾いていない</div>
      <div id="claude-body" hidden>
        <ol class="prog" id="claude-prog" hidden></ol>
        <div class="prog-ctl" id="claude-prog-ctl" hidden>
          <button id="prog-toggle" type="button">一時停止</button>
          <label class="bpm">BPM <input type="range" id="bpm-range" min="20" max="300" step="1"> <span id="bpm-val" class="mono"></span></label>
          <span id="prog-info" class="prog-info"></span>
        </div>
        <div class="chord-title" id="claude-title"></div>
        <ol class="tones" id="claude-tones"></ol>
        <div class="voiced"><span class="k">鳴らした音</span> <span id="claude-voiced" class="mono"></span></div>
        <ul class="warnings" id="claude-warn"></ul>
        <div class="actions">
          <button id="replay-btn" type="button">もう一度鳴らす <kbd>Space</kbd></button>
          <button id="reset-btn" type="button">リセット <kbd>Esc</kbd></button>
        </div>
      </div>
    </section>

    <section class="pane" aria-labelledby="midi-h">
      <h2 id="midi-h" class="pane-h"><span class="swatch swatch-midi"></span>MIDI入力</h2>
      <div id="midi-empty" class="empty">鍵盤を押すと、ここにコードの候補が出る</div>
      <div id="midi-body" hidden>
        <ol class="cands" id="midi-cands"></ol>
        <div class="voiced"><span class="k">押さえている音</span> <span id="midi-held" class="mono"></span></div>
        <div class="voiced" id="midi-interval-row" hidden><span class="k">音程</span> <span id="midi-interval"></span></div>
        <div class="pedal" id="midi-pedal" hidden>ペダル</div>
      </div>
    </section>
  </main>

  <div class="kb-wrap">
    <div id="keyboard" class="keyboard" aria-label="鍵盤"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
